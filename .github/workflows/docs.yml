name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'website/**'
      - 'assets/**'
      - 'book.toml'
      - 'scripts/build-site.sh'
      - 'scripts/install.sh'
      - 'src/**'
      - 'xtask/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify preview asset
        run: |
          test -s docs/assets/tui.png
          ls -lh docs/assets/tui.png

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install mdbook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv mdbook /usr/local/bin/

      - name: Generate credits page from credit branch
        run: |
          if git fetch origin credit && git show origin/credit:credits.json > /tmp/credits.json 2>/dev/null; then
            node scripts/generate-credits.js /tmp/credits.json "https://github.com/${{ github.repository }}"
          else
            echo "No credit branch or credits.json found, using existing docs/credits.md"
          fi

      - name: Generate CLI documentation
        run: cargo run --locked -p xtask -- gen-docs

      - name: Build site
        run: ./scripts/build-site.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
