name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0)'
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Validate version matches tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          TAG_VERSION="${TAG#v}"
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          LOCK_VERSION=$(awk '
            $0 == "name = \"forager\"" { found = 1; next }
            found && /^version = / { gsub(/version = |\"/, ""); print; exit }
          ' Cargo.lock)
          echo "Tag version: $TAG_VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! Cargo.toml has $CARGO_VERSION but tag is $TAG"
            echo "Prepare and merge a reviewed version candidate before tagging."
            echo "Then run the 'Tag Validated Release' workflow."
            exit 1
          fi
          if [ "$LOCK_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Cargo.lock has $LOCK_VERSION, expected $TAG_VERSION"
            exit 1
          fi
          test -s "docs/releases/${TAG}.md" || {
            echo "::error::Missing curated release notes: docs/releases/${TAG}.md"
            exit 1
          }
          echo "Versions and curated release notes match"

  preflight:
    name: Release Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint all Rust targets
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test all Rust targets
        run: cargo test --locked --all-targets --all-features
      - name: Compile operational Python scripts
        run: python3 -m compileall -q scripts
      - name: Test release installer integrity checks
        run: bash tests/install_script.sh
      - name: Test release provenance receipts
        run: bash tests/release_provenance.sh
      - name: Install locked website dependencies
        working-directory: website
        run: npm ci
      - name: Audit website dependencies
        working-directory: website
        run: npm audit --audit-level=high
      - name: Test website action bridge
        working-directory: website
        run: npm run test:bridge
      - name: Build website
        working-directory: website
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: website
        run: npx playwright install --with-deps chromium
      - name: Test visual operator surfaces
        working-directory: website
        run: npm run test:visual

  build:
    name: Build ${{ matrix.target }}
    needs: [validate, preflight]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            name: forager-darwin-amd64
            legacy_name: aoe-darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: forager-darwin-arm64
            legacy_name: aoe-darwin-arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: forager-linux-amd64
            legacy_name: aoe-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: forager-linux-arm64
            legacy_name: aoe-linux-arm64

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/forager dist/${{ matrix.name }}
          cp target/${{ matrix.target }}/release/aoe dist/${{ matrix.legacy_name }}
          cd dist
          tar -czf ${{ matrix.name }}.tar.gz ${{ matrix.name }}
          shasum -a 256 ${{ matrix.name }}.tar.gz > ${{ matrix.name }}.tar.gz.sha256
          tar -czf ${{ matrix.legacy_name }}.tar.gz ${{ matrix.legacy_name }}
          shasum -a 256 ${{ matrix.legacy_name }}.tar.gz > ${{ matrix.legacy_name }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.name }}
          path: |
            dist/${{ matrix.name }}.tar.gz
            dist/${{ matrix.name }}.tar.gz.sha256
            dist/${{ matrix.legacy_name }}.tar.gz
            dist/${{ matrix.legacy_name }}.tar.gz.sha256

  operator-bundle:
    name: Package Telegram Operator
    needs: [validate, preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
      - name: Build operator bundle
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          BUNDLE="forager-operator-${VERSION}"
          mkdir -p "dist/${BUNDLE}/docs/releases"
          cp -R scripts "dist/${BUNDLE}/"
          cp README.md LICENSE "dist/${BUNDLE}/"
          cp docs/remote-operator.md docs/adaptive-wiki.md docs/offdesk-operation-status.md \
            docs/guides/configuration.md "dist/${BUNDLE}/docs/"
          cp "docs/releases/v${VERSION}.md" "dist/${BUNDLE}/docs/releases/"
          python3 -m compileall -q "dist/${BUNDLE}/scripts"
          "dist/${BUNDLE}/scripts/offdesk_remote_operator_telegram.py" --help >/dev/null
          "dist/${BUNDLE}/scripts/install_offdesk_telegram_operator_service.py" --help >/dev/null
          find "dist/${BUNDLE}" -type d -name __pycache__ -prune -exec rm -r {} +
          tar -C dist -czf "dist/${BUNDLE}.tar.gz" "${BUNDLE}"
          cd dist
          shasum -a 256 "${BUNDLE}.tar.gz" > "${BUNDLE}.tar.gz.sha256"
      - name: Upload operator artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: forager-operator
          path: |
            dist/forager-operator-*.tar.gz
            dist/forager-operator-*.tar.gz.sha256

  release:
    name: Create Release
    needs: [build, operator-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "=== Artifacts directory ==="
          ls -laR artifacts/
          echo "=== Finding tar.gz files ==="
          find artifacts -type f -name '*.tar.gz*' | head -20

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build release provenance receipt
        run: |
          TAG="${{ steps.version.outputs.version }}"
          VERSION="${TAG#v}"
          python3 scripts/build_release_provenance.py \
            --version "$VERSION" \
            --tag "$TAG" \
            --source-sha "$(git rev-parse HEAD)" \
            --repository "${{ github.repository }}" \
            --artifacts-dir artifacts \
            --release-notes "docs/releases/${TAG}.md" \
            --out artifacts/release-provenance.json

      - name: Create Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Forager ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          body_path: docs/releases/${{ steps.version.outputs.version }}.md
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
            artifacts/release-provenance.json
